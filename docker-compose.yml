services:
  telegram-multimodal-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-multimodal-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/tasks.db
      - NORMAHUB_BASE_URL=https://api.normahub.cc/v1
    volumes:
      - studio-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  studio-data:
    name: telegram-multimodal-studio-data
