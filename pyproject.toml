[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-multimodal-studio"
version = "1.0.0"
description = "Production-grade multimodal Telegram bot (aiogram 3.15+) with Whisper voice/circle transcription and ByteDance SeeDance 2.5 & Grok video generation via NormaHub"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "NormaHub Engineering Team", email = "dev@normahub.cc" }
]
keywords = [
    "telegram",
    "aiogram",
    "whisper",
    "seedance",
    "grok-video",
    "multimodal",
    "normahub",
    "video-generation",
    "voice-transcription",
    "russia-ai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech"
]
dependencies = [
    "aiogram>=3.15.0",
    "pydantic-settings>=2.2.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "data"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["bot"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as asyncio coroutine",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
